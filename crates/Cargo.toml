[workspace]
members = ["hello_world", "host_functions", "host_functions_macros", "stdlib", "wasm_vm"]
exclude = ["example_contract"]
resolver = "3"

[workspace.dependencies]
cxx = { version = "1.0.194", features = ["c++20"] }

[workspace.package]
edition = "2024"

[profile.release]
opt-level = 3
overflow-checks = true
lto = true
debug = true

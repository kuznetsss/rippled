# server_and_ports.cfg — [server] with three port sections.
# Port-level fields are limited to `port` and `ip` to avoid the serde
# flatten limitation with the INI custom deserializer (Vec/u16 fields in
# a #[serde(flatten)] context currently go through deserialize_any which
# does not coerce strings to integers).
[server]
port_rpc_admin_local
port_peer
port_ws_admin_local
send_queue_limit=500

[port_rpc_admin_local]
port=5005
ip=127.0.0.1

[port_peer]
port=51235
ip=0.0.0.0

[port_ws_admin_local]
port=6006
ip=127.0.0.1

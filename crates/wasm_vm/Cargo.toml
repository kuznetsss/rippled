[package]
name = "wasm_vm"
version = "0.1.0"
edition.workspace = true

[lib]
# staticlib: linked into rippled by corrosion.
# rlib: lets `cargo test` build & run the crate's own unit tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
wasmi = "=1.0.9"
cxx.workspace = true
host_functions = { path = "../host_functions" }
# Compiles WebAssembly text (WAT) to wasm bytes. Used by the `compile_wat` cxx
# bridge helper (a tooling/test convenience) as well as the inline
# `#[cfg(test)]` tests below.
wat = "1"

[dev-dependencies]
# `sha2` backs the MockHost's sha512_half so the end-to-end test can check a
# real digest.
sha2 = "0.10"
